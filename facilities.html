<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAFE-HOME · 세대 시설자료</title><link rel="stylesheet" href="css/unit-tools.css"><style>body{margin:0;background:#f3f6f8;color:#142d40;font:15px system-ui}main{max-width:720px;margin:32px auto;padding:24px;background:white;border:1px solid #dae2e8;border-radius:16px}h1{font-size:24px}label{display:grid;gap:7px;margin:16px 0}input,select,button{font:inherit;padding:12px;border:1px solid #cbd5df;border-radius:8px}fieldset{border:1px solid #dce3e9;border-radius:10px;margin:16px 0}button{background:#163e57;color:white;cursor:pointer}nav a{margin-right:20px;color:#245575}#feedback{white-space:pre-wrap}</style><link rel="stylesheet" href="css/workspace-refresh.css"><main><nav><a href="data-review.html">K-apt 자료 검토</a><a href="situation.html">상황실</a><a href="field.html">현장대원</a></nav><h1>세대 시설자료</h1><p>세대별 설치 여부와 위치·평면도를 등록합니다.</p><label>건물<select id="building"></select></label><label>세대<select id="unit"></select></label><form id="facility-form"><div id="fields"></div><label>자료 출처<input id="source" maxlength="300" required placeholder="도면명 또는 점검 자료"></label><label>확인일<input id="verified" type="date" required></label><label>확인자<input id="inspector" maxlength="40" required></label><label>평면도 이미지 · 2MB 이하<input id="plan" type="file" accept="image/png,image/jpeg,image/webp"></label><img id="preview" alt="등록 평면도 미리보기" style="max-width:100%" hidden><label><span><input id="remove-plan" type="checkbox"> 등록 평면도 삭제</span></label><button>이 세대 자료 저장</button></form><p id="feedback" role="status"></p><p class="tool-note">진행 중인 사건에는 생성 당시 자료가 유지됩니다. 같은 브라우저에서 공유하는 데모입니다.</p></main><script src="js/ui.js"></script><script src="js/data.js"></script><script src="js/csv.js"></script><script src="js/store.js"></script><script src="js/unit-facilities.js"></script><script src="js/workspace-refresh.js"></script></html>
