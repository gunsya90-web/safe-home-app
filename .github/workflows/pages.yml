name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify scenarios
        run: node --test tests/*.test.cjs

      - name: Stage public files
        run: |
          mkdir -p dist
          cp index.html resident.html field.html situation.html facilities.html data-review.html sw.js manifest.webmanifest dist/
          cp -r css js icons dist/
          # Local reference collection is excluded until redistribution terms are verified.
          echo 'window.SAFEHOME_COMPLEX_REFERENCES={checkedOn:null,fields:[],complexes:[]};' > dist/js/complex-reference-data.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
